steps:
  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    args: ['run', '--privileged', 'multiarch/qemu-user-static@sha256:fe60359c92e86a43cc87b3d906006245f77bfc0565676b80004cc666e4feb9f0']
    id: 'initialize-qemu'

  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    args: ['buildx', 'create', '--name', 'multiarch', "--use"]
    id: 'create-builder-and-use'

  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    args: ['buildx', 'inspect', '--bootstrap']
    id: 'show-target-build-platforms'

  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    id: 'build-multi-arch-image'
    entrypoint: sh
    args:
      - "-c"
      - |
        if [ -f skaffold.yaml.tmpl ]; then
          sed -e "s|\$${PROJECT_ID}|$PROJECT_ID|g" \
              -e "s|\$${REGION}|$_REGION|g" \
              skaffold.yaml.tmpl > skaffold.yaml
        fi

        for f in cloud_run/*.yaml.tmpl; do
          if [ -f "$$f" ]; then
            sed -e "s|\$${PROJECT_ID}|$PROJECT_ID|g" \
                -e "s|\$${REGION}|$_REGION|g" \
                -e "s|\$${MCP_INGRESS}|$_MCP_INGRESS|g" \
                "$$f" > "$${f%.tmpl}"
          fi
        done

        curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && \
        install skaffold /usr/local/bin/

        skaffold build \
          --file-output=/workspace/artifacts.json \
          --default-repo=$_CONTAINER_REGISTRY \
          --cache-artifacts=false \
          --push=true

        for img in legacy-dms income-verification-api corporate-email; do
          img_base="$_REGION-docker.pkg.dev/$PROJECT_ID/mcp-docker/$img"
          built_tag=$$(grep -o "$$img_base:[^\" ]*" /workspace/artifacts.json | head -n 1)
          if [ -n "$$built_tag" ]; then
            docker tag "$$built_tag" "$$img_base:latest"
            docker push "$$img_base:latest"
          fi
        done

substitutions:
  _CONTAINER_REGISTRY: ''
  _REGION: 'us-west4'
  _MCP_INGRESS: 'all'

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'DOCKER_CLI_EXPERIMENTAL=enabled'
    - 'DOCKER_API_VERSION=1.41'
